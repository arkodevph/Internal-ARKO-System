name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres?schema=arko
          DIRECT_URL: postgresql://ci:ci@localhost:5432/postgres?schema=arko
        run: pnpm --filter @arko/db exec prisma validate

      - name: Lint web
        run: pnpm --filter @arko/web lint

      - name: Web tests
        run: pnpm --filter @arko/web test -- --runInBand

      - name: PM review gate
        run: pnpm --filter @arko/pm verify:gate

      - name: Build all services
        run: |
          pnpm --filter @arko/api build
          pnpm --filter @arko/web build
          pnpm --filter @arko/finance-app build
          pnpm --filter @arko/portal build
          pnpm --filter @arko/pm build
