name: System Keepalive

on:
  schedule:
    # Run around the clock and avoid the top of each hour.
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: system-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the system service warm
        run: |
          curl --fail --silent --show-error \
            --retry 1 --retry-all-errors \
            --max-time 120 \
            https://app.arkodevph.com/health
