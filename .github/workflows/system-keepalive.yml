name: System Keepalive

on:
  schedule:
    # Weekdays, 9:07 AM–5:57 PM in Manila. Avoid the top of each hour.
    - cron: '7-57/10 9-17 * * 1-5'
      timezone: Asia/Manila
  workflow_dispatch:

permissions: {}

concurrency:
  group: system-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the system service warm
        run: |
          curl --fail --silent --show-error \
            --retry 1 --retry-all-errors \
            --max-time 120 \
            https://arko-internal.onrender.com/health
