name: Client Request GitHub Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: client-request-github-sync
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync request commits and progress
        env:
          CRON_SECRET: ${{ secrets.ARKO_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ARKO_CRON_SECRET is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://arko-internal.onrender.com/api/client-requests/cron
