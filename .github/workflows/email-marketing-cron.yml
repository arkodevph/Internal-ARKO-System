name: Email Marketing Scheduler

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:

concurrency:
  group: email-marketing-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process due campaigns and automations
        env:
          CRON_SECRET: ${{ secrets.ARKO_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ARKO_CRON_SECRET is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://arko-api.onrender.com/api/email-marketing/cron
