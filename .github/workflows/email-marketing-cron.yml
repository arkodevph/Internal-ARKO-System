name: Email Marketing Scheduler

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

concurrency:
  group: email-marketing-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due campaigns and automations
        env:
          CRON_SECRET: ${{ secrets.ARKO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 90 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://arkodevph.com/api/email-marketing/cron
