services:
  - type: web
    name: arko
    plan: free
    autoDeployTrigger: checksPass
    runtime: node
    region: singapore
    domains:
      - app.arkodevph.com
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @arko/web build
    startCommand: pnpm --filter @arko/web exec next start -p $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/web/**
        - apps/pm/src/components/**
        - apps/pm/src/server/**
        - packages/**
        - pnpm-lock.yaml
    envVars:
      - key: ARKO_SURFACE
        value: unified
      - key: AUTH_URL
        value: https://app.arkodevph.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.arkodevph.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
